<svg width="480" height="420" viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="55%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- soft glow backdrop -->
  <ellipse cx="240" cy="230" rx="190" ry="150" fill="url(#g1)" opacity="0.08"/>

  <!-- Layer 3: bottom (database) -->
  <g opacity="0.95">
    <polygon points="240,260 400,190 400,240 240,310" fill="url(#g3)"/>
    <polygon points="240,260 80,190 80,240 240,310" fill="url(#g3)" opacity="0.75"/>
    <polygon points="80,190 240,120 400,190 240,260" fill="url(#g3)" opacity="0.9"/>
  </g>

  <!-- Layer 2: middle (server) -->
  <g opacity="0.97">
    <polygon points="240,170 370,112 370,158 240,216" fill="url(#g2)"/>
    <polygon points="240,170 110,112 110,158 240,216" fill="url(#g2)" opacity="0.8"/>
    <polygon points="110,112 240,56 370,112 240,170" fill="url(#g2)" opacity="0.95"/>
  </g>

  <!-- Layer 1: top (app) -->
  <g>
    <polygon points="240,80 340,36 340,74 240,118" fill="url(#g1)"/>
    <polygon points="240,80 140,36 140,74 240,118" fill="url(#g1)" opacity="0.85"/>
    <polygon points="140,36 240,-6 340,36 240,80" fill="url(#g1)"/>
  </g>

  <!-- floating dots representing code / data nodes -->
  <circle cx="120" cy="150" r="6" fill="#f97316"/>
  <circle cx="360" cy="150" r="5" fill="#8b5cf6"/>
  <circle cx="90" cy="250" r="4" fill="#ec4899"/>
  <circle cx="390" cy="260" r="6" fill="#f97316"/>
  <circle cx="240" cy="330" r="5" fill="#8b5cf6"/>

  <!-- connecting lines -->
  <path d="M120 150 C 160 120, 200 100, 240 80" stroke="#f97316" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M360 150 C 320 120, 280 100, 240 80" stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M90 250 C 140 240, 190 230, 240 216" stroke="#ec4899" stroke-width="1.5" fill="none" opacity="0.4"/>
</svg>
